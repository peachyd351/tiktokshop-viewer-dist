<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cập nhật TTS Viewer</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .update {
        max-width: 560px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.5;
      }
      .ver {
        font-size: 20px;
        font-weight: 700;
        margin: 12px 0;
      }
      #notes {
        white-space: pre-wrap;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 8px;
        padding: 10px 12px;
        margin: 12px 0;
      }
      #steps li {
        margin: 6px 0;
      }
      code {
        background: rgba(255, 255, 255, 0.08);
        padding: 1px 6px;
        border-radius: 4px;
      }
      #status.ok {
        color: #4ade80;
      }
    </style>
  </head>
  <body>
    <main class="update">
      <h1>Cập nhật TikTok Shop Clip Viewer</h1>
      <div class="ver"><span id="cur"></span> <span id="next"></span></div>
      <div id="notes" hidden></div>
      <ol id="steps" hidden>
        <li>Mở thư mục đã chọn lúc “Load unpacked” (thư mục có file <code>manifest.json</code>).</li>
        <li>Bấm đúp file <code>Cập nhật.bat</code>. Cửa sổ đen hiện tiến trình tải; xong sẽ báo “✓ Đã cập nhật”.</li>
        <li>Để trang này mở: extension tự khởi động lại khi cập nhật xong.</li>
      </ol>
      <p id="status" class="muted">Đang kiểm tra…</p>
    </main>
    <script type="module" src="update.js"></script>
  </body>
</html>
